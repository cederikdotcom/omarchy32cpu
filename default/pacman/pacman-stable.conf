# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = i686
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# The desktop stack is built against these and shadows two of them: the
# prebuilt libinput 1.29 overwrites the repo's 1.27 (Hyprland 0.56 needs the
# newer API), and Quickshell links private Qt APIs, so a qt6-base or
# qt6-declarative upgrade breaks it until it is rebuilt. Unpin only when you
# are ready to reinstall the stack.
IgnorePkg = libinput qt6-base qt6-declarative

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# The fork package repo for override packages (fontconfig first) and the
# omarchy-own i686 rebuilds will be added here once it is stood up.
# [omarchy]
# Server = https://pkgs.omarchy.org/stable/$arch
