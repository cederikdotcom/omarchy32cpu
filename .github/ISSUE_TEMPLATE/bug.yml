name: Bug
description: Report a bug in omarchy32cpu that is not already a known limitation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check the "What is expected to be broken or absent" section of
        [TESTING.md](https://github.com/cederikdotcom/omarchy32cpu/blob/main/TESTING.md).
        No screen sharing, no animations, no hardware video decode, no plugin system,
        broken screen recording and no preinstalled applications are all known and
        documented, most of them permanently.

        If you are reporting how the fork behaved on a particular machine, use the
        hardware report form instead - it asks for the right things.

        This is an unaffiliated fork of Omarchy by one person, not a product.
        Upstream's support channels do not cover it.

  - type: input
    id: system-details
    attributes:
      label: System details
      description: CPU, GPU, architecture, and which install runbook you followed.
      placeholder: e.g. i5-2520M, Intel HD 3000, x86_64, install-x86_64.md
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What's wrong?
      description: |
        Describe the issue and how to recreate it. Attach the relevant diagnostics from
        the "Diagnostics to attach" section of TESTING.md. Note that `omarchy-debug`
        does not work in this fork - it needs `inxi`, which the core package set does
        not install.
      render: shell
    validations:
      required: true
