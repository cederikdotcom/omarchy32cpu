# omarchy32cpu test config: flat mode (no GPU effects), pixman renderer.
# Bindings are doubled on SUPER and ALT: browser VNC clients on macOS
# swallow Cmd/Super, so ALT is the reliable modifier over noVNC.
monitor = , preferred, auto, 1

animations { enabled = false }
decoration {
    rounding = 0
    blur:enabled = false
    shadow:enabled = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0xff225588
}
general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgba(88bbffee)
    col.inactive_border = rgba(44556688)
}
input { kb_layout = us }

$mod = SUPER
$alt = ALT

# Launch / close
bind = $mod, Return, exec, foot
bind = $alt, Return, exec, foot
bind = $mod, W, killactive,
bind = $alt, W, killactive,
bind = $mod, M, exit,
bind = $alt, M, exit,

# Layout
bind = $mod, F, fullscreen,
bind = $alt, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $alt, V, togglefloating,
bind = $mod, J, layoutmsg, togglesplit
bind = $alt, J, layoutmsg, togglesplit
bind = $mod, P, pseudo,

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $alt, left, movefocus, l
bind = $alt, right, movefocus, r
bind = $alt, up, movefocus, u
bind = $alt, down, movefocus, d

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $alt SHIFT, left, movewindow, l
bind = $alt SHIFT, right, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $alt, 1, workspace, 1
bind = $alt, 2, workspace, 2
bind = $alt, 3, workspace, 3
bind = $alt, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $alt SHIFT, 1, movetoworkspace, 1
bind = $alt SHIFT, 2, movetoworkspace, 2

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindm = $alt, mouse:272, movewindow
bindm = $alt, mouse:273, resizewindow

debug { disable_logs = false }
